<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe4ff">
<title>إدارة مهرجان الكرازة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--sky:#6cc6ff;--az:#2a86e0;--deep:#154a94;--t:#16345c;--m:#6784a6;--line:#d3e9fb;--ok:#1f9d63;--bad:#d6455d;--glow:0 0 24px rgba(74,167,255,.45);--f:"Cairo",Tahoma,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--t);font-family:var(--f);line-height:1.7;
 background:radial-gradient(700px 380px at 85% -5%,rgba(255,255,255,.9),transparent 65%),linear-gradient(180deg,#b5e0ff 0%,#dbf0ff 38%,#f6fbff 100%);background-attachment:fixed}
.cl{position:fixed;z-index:0;pointer-events:none;border-radius:999px;background:#fff;opacity:.7}
.cl::before,.cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl::before{width:55%;height:180%;left:12%;top:-80%}.cl::after{width:40%;height:140%;right:12%;top:-50%}
.c1{top:11%;left:-4%;width:150px;height:38px}.c2{top:40%;right:-6%;width:200px;height:48px;opacity:.5}
.w{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.top{text-align:center;margin-bottom:18px}
.logo{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;background:radial-gradient(circle at 30% 25%,#a5dcff,var(--az));box-shadow:var(--glow),inset 0 2px 0 rgba(255,255,255,.6)}
h1{font-size:26px;font-weight:900;margin:0;color:var(--deep)}
h2{font-size:18px;font-weight:700;margin:0 0 8px;color:var(--deep)}
.sub{color:var(--m);font-size:14px}
.card{background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 10px 26px rgba(42,134,224,.15),inset 0 1px 0 #fff}
label{display:block;font-size:13px;font-weight:600;color:var(--m);margin:8px 4px 0}
input,button{font:inherit;width:100%;margin:4px 0;border-radius:14px}
input{padding:12px 14px;color:var(--t);background:#fff;border:1.5px solid var(--line);outline:0}
input:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(108,198,255,.28)}
input::placeholder{color:#9db6d0}
button{padding:12px;border:0;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--sky),var(--az));box-shadow:0 6px 16px rgba(42,134,224,.32)}
button:active{transform:scale(.97)}
button.s{background:#fff;color:var(--az);border:1.5px solid var(--line);box-shadow:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g{display:flex;justify-content:space-between;align-items:center;gap:10px}.g button{width:auto;padding:10px 16px;white-space:nowrap}
.m{color:var(--m);font-size:14px}
.note{border-radius:14px;padding:11px 14px;margin-bottom:12px;font-weight:600}
.note.ok{background:#e6f8ef;color:#136b43}.note.bad{background:#ffe9ed;color:#a3293f}
.bar{height:8px;background:#e3f1fd;border-radius:9px;overflow:hidden;margin:8px 0 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--az))}
.bt{position:fixed;top:0;left:0;right:0;height:3px;z-index:9;opacity:0;background:linear-gradient(90deg,transparent,var(--az),transparent) no-repeat;background-size:45% 100%}
body.busy .bt{opacity:1;animation:sw 1s linear infinite}body.busy button{pointer-events:none;opacity:.7}
@keyframes sw{from{background-position:130% 0}to{background-position:-130% 0}}
#sheet{display:none}
@page{size:A4;margin:8mm}
@media print{
 body{background:#fff}.cl,.bt,.w{display:none!important}#sheet{display:block}
 .pg{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:35mm;height:281mm;break-after:page;page-break-after:always}
 .pg:last-child{break-after:auto;page-break-after:auto}
 .cd{border:1px dashed #555;margin:1mm;padding:2mm;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:11px;overflow:hidden}
 .cd b{font-size:13px}.cd .c{font-family:monospace;font-size:20px;letter-spacing:3px;direction:ltr;margin:3px 0}
}
</style></head><body>
<div class="bt"></div><i class="cl c1"></i><i class="cl c2"></i>
<div class="w" id="app"></div><div id="sheet"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxZta1cg9z1qkrxJUtygVwn4xodpn9CqrNJRt12pCoe2kk0xjlfp7wNATQrnhh5KoU/exec';
let S={pw:null,list:null,cols:[],msg:'',ok:'',codes:{},d:{}},inflight=false;
try{S.pw=sessionStorage.getItem('kza')}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const IDS=['ap','mn','mc','mp','mk'];
function keep(){IDS.forEach(i=>{const e=$(i);if(e)S.d[i]=e.value})}
async function api(action,x){
 if(inflight)return null;inflight=true;document.body.classList.add('busy');
 try{
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),40000);
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctl.signal,body:JSON.stringify({action,adminPass:S.pw,...x})});
  clearTimeout(to);const j=await r.json();if(!j.ok)throw new Error(j.error||'حصل خطأ');return j;
 }catch(e){S.msg=e.name==='AbortError'||e.message==='Failed to fetch'?'مشكلة في الاتصال، جرب تاني':e.message;return null}
 finally{inflight=false;document.body.classList.remove('busy')}
}
async function load(){const j=await api('admin_meetings');if(j){S.list=j.meetings;S.cols=j.cols}}
async function login(){keep();S.pw=$('ap').value;S.msg='';await load();
 if(S.list){try{sessionStorage.setItem('kza',S.pw)}catch(e){}S.d={}}else S.pw=null;render()}
async function create(){keep();S.msg='';S.ok='';
 const D=S.d,name=(D.mn||'').trim(),col=(D.mc||'').trim(),pts=+D.mp,n=Math.floor(+D.mk);
 if(!name)return say('اكتب اسم الاجتماع');
 if(!col)return say('اكتب اسم العمود اللي هيتكتب فيه السكور');
 if(!(pts>0))return say('اكتب السكور (رقم أكبر من صفر)');
 if(!(n>=1&&n<=500))return say('عدد الأكواد من 1 لـ 500');
 const j=await api('admin_create',{name,col,points:pts,count:n});
 if(j){S.list=j.meetings;S.cols=j.cols;S.codes[name]=j.codes;S.ok='تم إنشاء '+n+' كود ✅ دوس طباعة';S.d={}}
 render()}
const say=m=>{S.msg=m;render()};
async function printM(i){const m=S.list[i];S.msg='';
 if(!S.codes[m.name]){const j=await api('admin_codes',{name:m.name});if(!j)return render();S.codes[m.name]=j.codes}
 const c=S.codes[m.name],pg=[];
 for(let k=0;k<c.length;k+=24)pg.push(c.slice(k,k+24));
 $('sheet').innerHTML=pg.map(p=>'<div class="pg">'+p.map(x=>`<div class="cd"><div class="m">✝ مهرجان الكرازة</div><b>${esc(m.name)}</b><div class="m">${String(x.serial).padStart(3,'0')} — ${m.points} نقطة</div><div class="c">${x.code}</div></div>`).join('')+'</div>').join('');
 requestAnimationFrame(()=>requestAnimationFrame(()=>{window.print();setTimeout(()=>{$('sheet').innerHTML=''},1500)}));
}
function out(){S={pw:null,list:null,cols:[],msg:'',ok:'',codes:{},d:{}};try{sessionStorage.removeItem('kza')}catch(e){}render()}
function render(){keep();
 let h='<div class="top"><div class="logo">✝</div><h1>إدارة المهرجان</h1><div class="sub">أكواد الحضور والنقاط</div></div>';
 if(S.msg)h+=`<div class="note bad">${esc(S.msg)}</div>`;if(S.ok)h+=`<div class="note ok">${esc(S.ok)}</div>`;
 if(!S.pw)h+='<div class="card"><input id="ap" type="password" placeholder="باسورد الإدارة"><button onclick="login()">دخول</button></div>';
 else{
  if(!S.list&&!inflight){load().then(render)}
  h+=`<div class="card"><h2>إنشاء أكواد جديدة</h2>
  <label>اسم الاجتماع</label><input id="mn" placeholder="مثلا: اجتماع الجمعة">
  <label>العمود اللي هيتكتب فيه السكور (شيت Score)</label><input id="mc" list="cols" placeholder="اسم عمود جديد أو موجود"><datalist id="cols">${S.cols.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <div class="row"><div><label>السكور لكل ولد</label><input id="mp" type="number" inputmode="numeric" placeholder="500"></div><div><label>عدد الأكواد</label><input id="mk" type="number" inputmode="numeric" placeholder="لحد 500"></div></div>
  <button onclick="create()">إنشاء الأكواد</button></div>`;
  h+=(S.list||[]).map((m,i)=>`<div class="card"><div class="g"><div><b>${esc(m.name)}</b><div class="m">العمود: ${esc(m.col)} — ${m.points} نقطة</div><div class="m">استُخدم ${m.used} من ${m.total}</div></div><button onclick="printM(${i})">🖨 طباعة</button></div><div class="bar"><i style="width:${m.total?m.used/m.total*100:0}%"></i></div></div>`).join('');
  h+='<button class="s" onclick="out()">خروج</button>';
 }
 $('app').innerHTML=h;
 IDS.forEach(i=>{if($(i)&&S.d[i])$(i).value=S.d[i]});
 const ap=$('ap');if(ap)ap.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
}
render();
</script></body></html>
